[project]
name = "findex"
version = "0.7.0"
description = "findex — a small search engine built step by step (Python course)"
authors = [{ name = "Ilia Shevel" }]
keywords = ["search", "inverted-index", "bm25", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# після `uv tool install .` з'являється команда findex, яка викликає findex.cli:app
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "py-spy>=0.4.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) у значенні за замовчуванням - це звичайний стиль FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# у скриптах бенчмарків довгі рядки - це шапки markdown-таблиць
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: довгі тести (> 1 s), пропустити: -m \"not slow\""]
filterwarnings = [
    # Starlette радить httpx2 для TestClient; поки що лишаємось на httpx
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.coverage.run]
source = ["findex"]

[tool.coverage.report]
show_missing = true
