# Render Blueprint: New -> Blueprint -> цей репозиторій.
# Render сам збирає Dockerfile, передає PORT і перевіряє /health перед тим,
# як пустити трафік на нову версію (і перезапускає сервіс, якщо /health падає).
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: INDEX_PATH
        value: /app/index.bin
      - key: LOG_LEVEL
        value: INFO
